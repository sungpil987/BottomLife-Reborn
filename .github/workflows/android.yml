name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - name: Install Godot 4.3 and export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          sudo install -m 755 Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          unzip -q Godot_v4.3-stable_export_templates.tpz
          cp -r templates/. "$HOME/.local/share/godot/export_templates/4.3.stable/"
      - name: Create debug signing key
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: Configure Godot Android export paths
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
      - name: Diagnose export environment
        run: |
          echo "Godot export templates:"
          ls -lah "$HOME/.local/share/godot/export_templates/4.3.stable/" | head -30
          echo "Android SDK:"
          ls -lah "$ANDROID_HOME/build-tools/"
          ls -lah "$ANDROID_HOME/platforms/"
          echo "Java SDK:"
          ls -lah "$JAVA_HOME/bin/jarsigner"
          echo "Debug keystore:"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android
          echo "Godot editor configuration:"
          cat "$HOME/.config/godot/editor_settings-4.tres"
      - name: Validate Godot project and scripts
        run: |
          set -o pipefail
          godot --headless --editor --path . --import 2>&1 | tee godot-import.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|ERROR:.*(Parse|script)" godot-import.log; then
            echo "Godot import validation failed"
            exit 1
          fi
          godot --headless --path . --quit-after 3 2>&1 | tee godot-validation.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|ERROR:.*(Parse|script)" godot-validation.log; then
            echo "Godot script validation failed"
            exit 1
          fi
      - name: Run gameplay smoke tests
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/smoke_test.gd 2>&1 | tee godot-smoke.log
          grep -q "SMOKE TEST PASSED" godot-smoke.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|ERROR:" godot-smoke.log; then
            echo "Gameplay smoke test logged errors"
            exit 1
          fi
      - name: Import and export APK
        run: |
          set -o pipefail
          mkdir -p build
          godot --headless --verbose --path . --export-debug Android build/BottomLife-debug.apk 2>&1 | tee godot-export.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|ERROR:.*(export|script|parse)" godot-export.log; then
            echo "Godot export errors detected"
            exit 1
          fi
          test -s build/BottomLife-debug.apk
      - name: Verify APK package and signing
        run: |
          set -euo pipefail
          unzip -t build/BottomLife-debug.apk | tail -2
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging build/BottomLife-debug.apk | tee apk-badging.log
          grep -q "package: name='com.bottomlife.reborn'" apk-badging.log
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose build/BottomLife-debug.apk | tee apk-signature.log
          sha256sum build/BottomLife-debug.apk | tee apk-sha256.txt
      - name: Upload Godot diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BottomLife-Diagnostics
          path: |
            godot-import.log
            godot-validation.log
            godot-smoke.log
            godot-export.log
            apk-badging.log
            apk-signature.log
            apk-sha256.txt
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: BottomLife-APK
          path: build/BottomLife-debug.apk
          if-no-files-found: error
